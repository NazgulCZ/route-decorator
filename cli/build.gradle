plugins {
    id 'java'
    id 'application'
}

group = 'com.nazgulcz'
version = '4.1.0'

repositories {
    mavenCentral()
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

dependencies {
    implementation project(':core')

    compileOnly 'org.projectlombok:lombok:1.18.46'
    annotationProcessor 'org.projectlombok:lombok:1.18.46'

    // JAXB for XML parsing
    implementation 'jakarta.xml.bind:jakarta.xml.bind-api:4.0.0'
    runtimeOnly 'com.sun.xml.bind:jaxb-impl:4.0.2'

    // JUnit for testing
    testImplementation 'org.junit.jupiter:junit-jupiter-api:6.1.0'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:6.1.0'
}

application {
    mainClass = 'com.nazgulcz.routedecorator.cli.Main'
}

run {
    standardInput = System.in
}

// Create a fat JAR with all dependencies
// Use collect instead of map for compatibility with the Gradle/Groovy runtime
// Exclude duplicate entries (module-info.class etc.) to avoid copy conflicts
import org.gradle.api.tasks.Sync.DuplicatesStrategy

task fatJar(type: Jar) {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    archiveBaseName = 'route-decorator'
    archiveVersion = version
    archiveClassifier = ''
    manifest {
        attributes 'Main-Class': application.mainClass
    }
    from sourceSets.main.output
    dependsOn configurations.runtimeClasspath
    from {
        configurations.runtimeClasspath.findAll { it.isFile() }.collect { zipTree(it) }
    }
    // Exclude duplicate metadata and module descriptors
    exclude 'META-INF/maven/**', 'META-INF/LICENSE*', 'META-INF/NOTICE*', '**/module-info.class', 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'
}

// Make fatJar the default build artifact
artifacts {
    archives fatJar
}

// Enable junit platform for tests
test {
    useJUnitPlatform()
}
