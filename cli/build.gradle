plugins {
    id 'java'
    id 'application'
}

group = 'com.nazgulcz'
version = '4.1.0'

repositories {
    mavenCentral()
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

dependencies {
    implementation project(':core')

    compileOnly 'org.projectlombok:lombok:1.18.46'
    annotationProcessor 'org.projectlombok:lombok:1.18.46'

    // JAXB for XML parsing
    implementation 'jakarta.xml.bind:jakarta.xml.bind-api:4.0.0'
    runtimeOnly 'com.sun.xml.bind:jaxb-impl:4.0.2'
}

application {
    mainClass = 'com.nazgulcz.routedecorator.cli.Main'
}

run {
    standardInput = System.in
}

// Create a fat JAR with all dependencies
task fatJar(type: Jar) {
    archiveBaseName = 'route-decorator'
    archiveVersion = version
    archiveClassifier = ''
    manifest {
        attributes 'Main-Class': application.mainClass
    }
    from sourceSets.main.output
    dependsOn configurations.runtimeClasspath
    from {
        configurations.runtimeClasspath.findAll { it.isFile() }.map { zipTree(it) }
    }
    // Exclude duplicate metadata
    exclude 'META-INF/maven/**', 'META-INF/LICENSE*', 'META-INF/NOTICE*'
}

// Make fatJar the default build artifact
artifacts {
    archives fatJar
}
